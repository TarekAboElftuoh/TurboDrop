name: Build and Release TurboDrop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable & Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build TurboDrop Android APK
        run: |
          powershell.exe -ExecutionPolicy Bypass -File build_apk.ps1

      - name: Build TurboDrop Windows Standalone Executable (.exe)
        run: |
          python build_exe.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TurboDrop ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            TurboDrop.exe
            TurboDrop.apk
